<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langyu — каталог автодеталей</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f2f4f5;color:#182421;font:16px system-ui,sans-serif} button,input,select{font:inherit} button,select{cursor:pointer} button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #27987e;outline-offset:3px}
.bar{background:#12231f;color:white}.bar div,main{max-width:1240px;margin:auto;padding:18px 28px}.bar strong{font-size:23px;letter-spacing:.15em}.bar span{margin-left:18px;color:#b8cdc6;font-size:14px}
.bar div{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.bar span{margin-left:8px}#settings-open{margin-left:auto;background:#e2f0eb;color:#12231f;border:0;border-radius:8px;padding:9px 12px}#settings{max-width:575px}#pricing-form label{display:grid;gap:6px}#pricing-form button{background:#12231f;color:#fff;border:0;border-radius:8px;padding:10px 12px;margin:0 3px 6px 0}#pricing-form h3{margin-top:24px}
h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.065em;line-height:1;margin:30px 0 12px} h2{letter-spacing:-.035em} .intro{color:#53635e;margin:0 0 28px}.filters{display:grid;grid-template-columns:1fr auto;gap:12px}input,select{min-width:0;background:white;border:1px solid #ccd5d2;border-radius:8px;padding:13px;color:#182421} .count{color:#53635e;margin:18px 0}
.material-filter{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}.material-filter select{max-width:100%}
.categories{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.category{background:white;border:1px solid #ccd5d2;border-radius:8px;padding:8px 12px;color:inherit;text-align:left}.category[aria-pressed=true]{background:#12231f;border-color:#12231f;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{background:white;border:1px solid #dbe2df;border-radius:12px;overflow:hidden;text-align:left;padding:0;color:inherit;transition:box-shadow .2s,border-color .2s;display:flex;flex-direction:column}.card:hover{border-color:#27987e;box-shadow:0 8px 26px #183d2820}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e4ebe8}.summary{padding:15px;display:grid;gap:8px;width:100%}.summary b{font-size:21px;color:#125d4c}.summary small{color:#53635e}.name{min-height:3em}
.data-check{background:#fff4dc;color:#573900;border:1px solid #e9c67c;border-radius:8px;padding:9px 12px;font-size:14px}.supplier-question{display:block;margin-top:5px}.data-check ul{margin:6px 0 0;padding-left:20px}.data-check li+li{margin-top:4px}.check-filter{display:flex;gap:8px;align-items:center;margin-top:12px;color:#53635e}.check-filter input{accent-color:#125d4c}
.card-costs{display:grid;gap:4px;padding-top:8px;border-top:1px solid #dbe2df;font-size:14px}.card-costs strong{font-size:16px;color:#125d4c}
dialog{border:0;border-radius:14px;padding:0;width:min(960px,calc(100% - 24px));max-height:90vh;color:inherit;box-shadow:0 20px 80px #0005}dialog::backdrop{background:#12231fbb}.modal{padding:24px}.close{position:sticky;top:8px;float:right;z-index:1;background:#12231f;color:white;border:0;border-radius:8px;padding:9px 13px}.detail{clear:both;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.photo{width:100%;max-height:420px;object-fit:contain;background:#eef1f0;border-radius:8px}.thumbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.thumbs button{padding:0;border:2px solid transparent;border-radius:7px;overflow:hidden;background:white}.thumbs button[aria-pressed=true]{border-color:#287e6c}.thumbs img{width:61px;height:61px;object-fit:cover;display:block}.price{font-size:28px;font-weight:700;color:#125d4c}.desc{white-space:pre-wrap;overflow-wrap:anywhere}.description-img{display:block;width:min(100%,740px);margin:12px auto;border-radius:6px}dl{margin:0}dt{font-weight:650}dd{margin:3px 0 12px;overflow-wrap:anywhere}a{color:#125d4c}details{border-top:1px solid #dbe2df;padding:12px 0}summary{cursor:pointer;font-weight:650}
@media(max-width:640px){.bar div,main{padding:14px}.filters,.detail{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.summary{padding:10px}.modal{padding:14px}}
.avito-description{margin-top:24px}.avito-description p{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<script defer src="products.js"></script>
<script defer src="ru.js"></script>
<script defer src="localize.js"></script>
<script defer src="settings.js"></script>
<script defer src="pricing.js"></script>
<script defer src="offers.js"></script>
<script defer src="materials.js"></script>
<script defer src="avito.js"></script>
</head>
<body>
<header class="bar"><div><strong>LANGYU</strong><span>Автодетали · локальная витрина</span> <button id="settings-open" type="button">Настройки цен</button></div></header>
<main>
 <h1>Каталог автодеталей</h1>
 <p class="intro">Каталог продавца Langyu на 1688</p>
 <div id="categories" class="categories" role="group" aria-label="Категории товаров"></div>
 <div class="filters"><input id="search" type="search" aria-label="Поиск товаров" placeholder="Название, модель авто или ID"><select id="order" aria-label="Сортировка"><option value="">По умолчанию</option><option value="asc">Цена по возрастанию</option><option value="desc">Цена по убыванию</option></select></div>
 <label class="material-filter">Материал <select id="material"><option value="">Все материалы</option></select></label>
 <label class="check-filter"><input id="needs-check" type="checkbox"> Только карточки с данными на уточнение</label>
 <p id="count" class="count" aria-live="polite"></p>
 <section id="grid" class="grid" aria-label="Товары"></section>
 <div id="load-next"></div>
 <p><button id="more" type="button" hidden>Показать ещё</button></p>
</main>
<dialog id="dialog" aria-labelledby="product-title"><div class="modal"><button class="close" type="button">Закрыть</button><div id="product"></div></div></dialog>
<dialog id="settings" aria-labelledby="settings-title"><div class="modal">
 <form id="pricing-form">
  <h2 id="settings-title">Курс и доставка</h2>
  <p><label>Рублей за 1 юань <input name="rate" type="number" min="0" step="any" required></label></p>
  <p><label>Рублей за 1 доллар <input name="usdRate" type="number" min="0" step="any" required></label></p>
  <p><label>Доставка, $ за м³ <input name="usdPerM3" type="number" min="0" step="any" required></label></p>
  <p>Доставка рассчитывается по внешним размерам упаковки. Для пересчёта в рубли укажите оба курса.</p>
  <button type="submit">Применить</button> <button id="settings-close" type="button">Закрыть</button>
  <button id="settings-export" type="button">Скачать общие настройки</button>
  <p id="settings-status" role="status"></p>
 </form>
</div></dialog>
<script>
document.addEventListener('DOMContentLoaded', () => {
 const $ = id => document.getElementById(id);
 const grid=$('grid'), search=$('search'), order=$('order'), dialog=$('dialog');
 const settings=$('settings'), form=$('pricing-form');
 let config=window.pricing.load();
 const pageSize=24;
 let shown=pageSize;
 const sentinel=$('load-next');
 const more=$('more');
 const observer=typeof IntersectionObserver==='function'
   ? new IntersectionObserver(entries=>{
       if(entries.some(entry=>entry.isIntersecting) && !sentinel.hidden) loadMore();
     },{rootMargin:'0px 0px 300px 0px'})
   : null;
 let selectedCategory='';
 // Порядок правил учитывает названия, в которых упомянуто несколько деталей.
 const categoryRules = [
   ['Капоты', /海外V款包围.*引擎盖|尚酷多款机盖大包围/],
   ['Чехлы запасного колеса', /备胎罩/],
   ['Крышки багажника', /尾箱盖|后备箱盖|尾盖/],
   ['Крышки двигателя', /发动机罩|引擎罩|引擎盖罩/],
   ['Вставки капота', /机盖(?:ABS亮黑|ABS|素黑无漆黑色)?风口|引擎盖进气口|ABS亮黑风口|通用风口/],
   ['Комплекты обвеса', /小包围|全包围/],
   ['Бамперы и накладки', /前杠总成|后杠总成|前铲|前唇|小包角|(?:后唇|尾唇)/],
   ['Комплекты обвеса', /大包围|包围套件|(?:PP|pp|碳纤)包围|改装包围|PP材质包围/],
   ['Крылья', /叶子板|翼子板|挡泥板/],
   ['Капоты', /机盖|引擎盖|头盖|擎盖/],
   ['Спойлеры и антикрылья', /尾翼|顶翼|扰流板|定风翼/],
   ['Бамперы и накладки', /前杠|后杠/],
   ['Накладки порогов', /侧裙/],
   ['Насадки выхлопа', /尾喉/],
   ['Детали салона', /内饰|座椅|方向盘/],
   ['Наружные аксессуары', /百叶窗|顶灯/],
 ];
 const otherCategory='Прочее';
 function categoryFor(row) {
   return categoryRules.find(([,pattern])=>pattern.test(row.title))?.[0] ?? otherCategory;
 }
 const {expand, minimumOrder, hasVariants, unitPrice, packageFor}=window.catalogOffers;
 const products=window.products.flatMap(expand);
 const material=$('material');
 const productOptions=new Map(products.map(row=>[row,window.catalogMaterials.options(row)]));
 const availableMaterials=new Set([...productOptions.values()].flatMap(options=>options.flatMap(option=>option.materials)));
 for(const [key,label] of window.catalogMaterials.labels){
   if(!availableMaterials.has(key)) continue;
   const option=el('option',label);
   option.value=key;
   material.append(option);
 }
 const productCategories=new Map();
 const categoryCounts=new Map();
 for(const row of products){
   const category=row.category ?? categoryFor(row);
   productCategories.set(row,category);
   categoryCounts.set(category,(categoryCounts.get(category)??0)+1);
 }
 const {translate, title: ruTitle, dropship, shop, labels}=window.catalogRu;
 const translation = row => {
   const localized = window.ru[row.id] ?? [ruTitle(row),'','',[],null,null];
   const name = row.displayTitle ?? window.catalogTitles[row.id] ?? localized[0];
   return [name,...localized.slice(1)];
 };
 const variantLabels = {
   '双锁钩':'Два крюка замка',
   '单锁钩':'Один крюк замка',
   '黑+灰':'Чёрный с серым',
   '黑+橙':'Чёрный с оранжевым',
   '黑+红':'Чёрный с красным',
   '尾喉':'Насадки выхлопа',
   '中网带ACC':'Решётка с ACC',
   '中网不带ACC':'Решётка без ACC',
   '宝马F30半铝机盖':'Капот BMW F30, частично алюминиевый',
   '宝马F30铁机盖':'Капот BMW F30, стальной',
   '宝马F30全铝机盖':'Капот BMW F30, полностью алюминиевый',
 };
 const skuLabel = (row, sku, index) => {
   const label=variantLabels[sku.name] ?? translation(row)[3][index] ?? translate(sku.name);
   return label==='Нужна проверка перевода' ? sku.name : label;
 };
 const money = value => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(value);
 const range = (min,max,format) => min===max ? format(min) : format(min)+'–'+format(max);
 const rub = value => money(Math.round(value))+' ₽';
 const amount = value => '¥'+money(value);
 const optionPrice = (row, options) => Math.min(...options.map(option=>unitPrice(row,option.sku)));
 const priceLabel = (row, sku, options) => {
   const base=options ? optionPrice(row,options) : unitPrice(row,sku);
   const from=options?.some(option=>unitPrice(row,option.sku)>base);
   const minimum=minimumOrder(row);
   return (from?'от ':'')+amount(base)+' за 1 шт.'+(minimum>1?' (от '+minimum+' шт.)':'');
 };
 const suspiciousWeight = weight => weight>=100000;
 function supplierQuestions(row, sku, materials) {
   const pack=packageFor(row,sku);
   const weight=pack?.weight_g;
   const dims=[pack?.length_cm,pack?.width_cm,pack?.height_cm];
   const notes=[];
   const quantity=minimumOrder(row);
   const hasTier=row.price_tiers?.some(tier=>
     tier.min_quantity<=quantity && (tier.max_quantity==null || tier.max_quantity>=quantity));
   if(!Number.isFinite(unitPrice(row,sku)) ||
      (sku && sku.price==null && !hasTier && (row.price_min!==row.price_max || row.skus.some(option=>option.price!=null)))){
     notes.push('Сколько стоит одна деталь в этом исполнении?');
   } else if(row.price_tiers?.length && !hasTier){
     notes.push('Сколько стоит одна деталь при минимальном заказе?');
   }
   if(sku && /^(?:[A-Z]|MG)款$/i.test(sku.name)){
     notes.push('Чем отличается вариант «'+sku.name.replace(/款$/,'')+'»?');
   }
   if(!materials.length) notes.push('Из какого материала сделана эта деталь?');
   if(row.displayTitle && row.category==='Комплекты обвеса'){
     notes.push('Какие детали входят в этот комплект?');
   }
   if(!Number.isFinite(weight) || weight<=0){
     notes.push('Сколько весит деталь вместе с упаковкой?');
   } else if(weight<100 || suspiciousWeight(weight)){
     notes.push('Вес с упаковкой действительно '+money(weight/1000)+' кг?');
   }
   if(dims.some(n=>!Number.isFinite(n)||n<=0)){
     notes.push('Какие длина, ширина и высота упаковки в сантиметрах?');
   } else if(dims.some(n=>n>240)){
     notes.push('Размер упаковки действительно '+dims.join(' × ')+' см?');
   }
   return notes;
 }
 for(const [row,options] of productOptions){
   for(const option of options) option.questions=supplierQuestions(row,option.sku,option.materials);
 }
 function checkNotice(questions, compact=false) {
   if(!questions.length) return null;
   const notice=el(compact?'span':'aside',null,'data-check');
   notice.append(el('strong','Вопросы поставщику'));
   if(compact){
     for(const question of questions) notice.append(el('span',question,'supplier-question'));
   } else {
     const list=el('ul');
     for(const question of questions) list.append(el('li',question));
     notice.append(list);
   }
   return notice;
 }
 function cardCosts(row, options){
   const costs=el('span',null,'card-costs');
   const costRange=values=>range(Math.min(...values),Math.max(...values),rub);
   const estimates=options.map(({sku})=>({
     goods:config.rate ? unitPrice(row,sku)*config.rate : null,
     shipping:window.pricing.delivery(packageFor(row,sku),config),
   }));
   const shipping=estimates.map(option=>option.shipping);
   costs.append(el('strong','Цена в рублях с доставкой'));
   costs.append(el('span',config.rate
     ? 'Товар: '+costRange(estimates.map(option=>option.goods))+' за 1 шт.'
     : 'Товар: укажите курс юаня'));
   if(shipping.every(value=>value!==null)){
     costs.append(el('span','Доставка: ≈ '+costRange(shipping)+' за 1 шт.'));
     if(config.rate){
       const totals=estimates.map(option=>option.goods+option.shipping);
       costs.append(el('strong','Итого: ≈ '+costRange(totals)+' за 1 шт.'));
     }
   } else {
     costs.append(el('span',config.usdRate
       ? 'Доставка: уточните габариты упаковки'
       : 'Доставка: укажите курс доллара'));
   }
   return costs;
 }
 function el(tag, text, className) {
   const node=document.createElement(tag);
   if(text != null) node.textContent=text;
   if(className) node.className=className;
   return node;
 }
 function photo(src, alt, cls) {
   const image=el('img',null,cls);
   image.src=src; image.alt=alt; image.loading='lazy'; return image;
 }
 function imageLink(src, alt, cls) {
   const link=el('a'); link.href=src; link.target='_blank'; link.rel='noopener';
   link.append(photo(src,alt,cls)); return link;
 }
 function details(title, content) {
   const section=el('details'); section.append(el('summary',title),content); return section;
 }
 function fields(values){
   const list=el('dl');
   for(const [label,value] of values){
     if(value==null||value===''||(typeof value==='object'&&!Object.keys(value).length)) continue;
     const text=Array.isArray(value)?value.map(translate).join('\n'):typeof value==='boolean'?(value?'Да':'Нет'):translate(value);
     list.append(el('dt',label),el('dd',text,'desc'));
   }
   return list;
 }
 function avitoDescription(row) {
   const section=el('section',null,'avito-description');
   section.append(el('h2','Описание для Авито'),
     el('p',window.avitoDescription(row)||'Описание пока не добавлено.'));
   return section;
 }
 function open(row, selectedIndex=0, restoreFocus=false) {
   const sku=row.skus?.[selectedIndex];
   let picker;
   const [name, fits, note, skuNames, article, translatedDescription] = translation(row);
   const container=$('product'); container.replaceChildren();
   const layout=el('div',null,'detail'), gallery=el('div'), info=el('div');
   const title=el('h2',name); title.id='product-title';
   const main=imageLink(row.photos[0],name,'photo'), thumbs=el('div',null,'thumbs');
   row.photos.forEach((src,i)=>{
     const btn=el('button'); btn.type='button';
     btn.setAttribute('aria-label','Фото '+(i+1));
     btn.setAttribute('aria-pressed',String(i===0)); btn.append(photo(src,''));
     btn.addEventListener('click',()=>{
       main.href=src; main.firstChild.src=src;
       for(const thumb of thumbs.children) thumb.setAttribute('aria-pressed',String(thumb===btn));
     });
     thumbs.append(btn);
   });
   gallery.append(main,thumbs);
   info.append(el('div','1688 · '+row.id),title);
   if(hasVariants(row)){
     const label=el('label','Исполнение ');
     picker=el('select');
     for(const [index,option] of row.skus.entries()){
       const item=el('option',skuLabel(row,option,index));
       item.value=String(index);
       picker.append(item);
     }
     picker.value=String(selectedIndex);
     picker.addEventListener('change',()=>open(row,Number(picker.value),true));
     label.append(picker);
     info.append(label);
   }
   info.append(el('div',priceLabel(row,sku),'price'));
   info.append(cardCosts(row,[{sku}]));
   const notice=checkNotice(productOptions.get(row)[selectedIndex].questions);
   if(notice) info.append(notice);
   if(fits) info.append(el('p','Совместимость по карточке продавца: '+fits));
   if(!window.ru[row.id]) info.append(el('p','Название и характеристики переведены автоматически. Совместимость требует сверки.'));
   if(note) info.append(el('p',note));
   if(row.moq) info.append(el('p','Минимальный заказ: '+row.moq+' '+(translate(row.unit) || 'шт.')));
   if(!sku && row.unit_weight_kg>0) info.append(el('p','Вес с упаковкой по данным продавца: '+money(row.unit_weight_kg)+' кг'+(row.unit_weight_kg<0.1?' · требует проверки':'')));
   if(row.price_tiers?.length) {
     const list=el('ul');
     for(const tier of row.price_tiers) list.append(el('li', 'От '+tier.min_quantity+' шт. — '+amount(tier.price)));
     info.append(details('Оптовые цены',list));
   }
   if(sku?.stock!=null) info.append(el('p','Остаток по данным продавца: '+sku.stock));
   const pack=packageFor(row,sku);
   const weight=pack?.weight_g;
   const dims=[pack?.length_cm,pack?.width_cm,pack?.height_cm];
   const cubicMetres=window.pricing.volume(pack);
   info.append(details('Упаковка и доставка',fields([
     ['Данные упаковки',pack && hasVariants(row) && !pack.sku ? 'Общие для всех исполнений объявления' : null],
     ['Вес',weight>0 ? money(weight/1000)+' кг по данным продавца' : 'Вес не указан'],
     ['Габариты',dims.every(n=>n>0) ? dims.join(' × ')+' см' : null],
     ['Проверка данных',weight>0 && weight<100 ? 'Вес требует проверки' : null],
     ['Объём упаковки',cubicMetres===null ? null : money(cubicMetres)+' м³'],
   ])));
   if(!row.displayTitle && row.specs?.length){
     const list=el('dl');
     for(const spec of row.specs){
       const value=spec.name==='货号'&&article?article:spec.name==='规格'&&skuNames.length?skuNames.join('; '):window.specRu.values[spec.value]??spec.value;
       list.append(el('dt',window.specRu.labels[spec.name]??labels[spec.name]??'Характеристика'),el('dd',translate(value)));
     }
     info.append(details('Характеристики',list));
   }
   info.append(details('Продажи и оценки',fields([
     ['Продано по данным карточки',row.sold_count],['Как указано на 1688',row.sold_text],
     ['Продажи за 30 дней',row.listing?.sales30d],['Заказы',row.orders],['Доля повторных покупок',row.repurchase_rate==null?null:money(row.repurchase_rate*100)+' %'],
     ['Оценка из карточки',row.review_score],['Счётчик отзывов из карточки',row.review_count],
     ['Доля положительных',row.good_rate==null?null:money(row.good_rate*100)+' %'],
   ])));
   const shippingStats=dropship(row.dropship);
   if(shippingStats.length) {
     const group=el('div');
     group.append(el('p','Показатели продаж через партнёров. «До 100» — диапазон, который показывает 1688.'),fields(shippingStats));
     info.append(details('Дропшиппинг',group));
   }
   info.append(details('Отправка и условия продавца',fields([
     ['Регион отправки',row.ships_from],['Срок отправки, дней',row.dispatch_days],['Условия отправки',row.dispatch],
     ['Доставка по данным 1688, CNY',row.shipping_fee],['Гарантии и условия возврата',row.services],
     ['Акции',row.promotions?.map(item=>item.detail).filter(Boolean)],['Категория 1688',row.category_name],
     ['Дата публикации',row.listed_at],['Продавец',row.supplier_name],...shop(row.shop_scores),
   ])));
   if(row.reviews?.length) info.append(details('Найденные отзывы',fields(row.reviews.map(review=>[
     [review.rating+' / 5',review.publishedAt,review.isTemplateText?'Шаблонный отзыв':''].filter(Boolean).join(' · '),review.text
   ]))));
   for(const [label,url] of [['Карточка на 1688',row.url],['Видео продавца',row.video_url]]){
     if(!/^https:\/\//.test(url??'')) continue;
     const link=el('a',label); link.href=url; link.target='_blank'; link.rel='noopener noreferrer';
     const line=el('p'); line.append(link); info.append(line);
   }
   layout.append(gallery,info); container.append(layout);
   if(sku && (hasVariants(row)||row.displayTitle)){
     container.append(el('h2','Выбранное исполнение'),el('p',skuLabel(row,sku,selectedIndex)));
   }
   container.append(avitoDescription(row),el('h2','Описание продавца'));
   if(row.displayTitle) container.append(el('p','Описание и изображения продавца относятся к общему объявлению 1688.'));
   if(translatedDescription) container.append(el('p',translatedDescription,'desc'));
   else if(row.description) container.append(el('p',translate(row.description),'desc'));
   else if(row.descriptionPhotos.length) container.append(el('p','Фотографии продавца из раздела описания.'));
   else container.append(el('p','В выгрузке нет отдельного описания изделия.'));
   for(const [i,src] of row.descriptionPhotos.entries()) container.append(imageLink(src,'Изображение описания '+(i+1),'description-img'));
   if(!dialog.open){ dialog.showModal(); dialog.scrollTop=0; }
   if(restoreFocus) picker?.focus();
 }
 function render(start=0){
   const brands={bmw:'宝马',mercedes:'奔驰',audi:'奥迪',toyota:'丰田',porsche:'保时捷',mazda:'马自达',ford:'福特',tesla:'特斯拉'};
   const terms=search.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
   const onlyNeedsCheck=$('needs-check').checked;
   const results=products.flatMap(row=>{
     if(selectedCategory && productCategories.get(row)!==selectedCategory) return [];
     const text=row.search+' '+translation(row).flat().join(' ').toLowerCase()+' '+(row.skus??[]).map((sku,index)=>skuLabel(row,sku,index)).join(' ').toLowerCase();
     if(!terms.every(term=>text.includes(term)||text.includes(brands[term]??term))) return [];
     const options=productOptions.get(row).filter(option=>!material.value || option.materials.includes(material.value));
     const questions=[...new Set(options.flatMap(option=>option.questions))];
     return options.length && (!onlyNeedsCheck || questions.length) ? [{row,options,questions,price:optionPrice(row,options)}] : [];
   });
   if(order.value) results.sort((a,b)=>(order.value==='asc'?1:-1)*(a.price-b.price));
   $('count').textContent='Показано '+Math.min(shown,results.length)+' из '+results.length+' · Всего товаров: '+products.length;
   const hasMore=shown<results.length;
   sentinel.hidden=!hasMore;
   more.hidden=!hasMore || Boolean(observer);
   if(!start) grid.replaceChildren();
   if(!results.length && !start) grid.append(el('p','По этому запросу товаров нет.'));
   for(const {row,options,questions,price} of results.slice(start,shown)){
     const card=el('button',null,'card'); card.type='button';
     const summary=el('span',null,'summary');
     summary.append(el('span',translation(row)[0],'name'),el('b',priceLabel(row,undefined,options)));
     const notice=checkNotice(questions,true);
     if(notice) summary.append(notice);
     summary.append(cardCosts(row,options),el('small',row.id));
     card.append(photo(row.photos[0],''),summary); card.addEventListener('click',()=>open(row,material.value ? options.find(option=>unitPrice(row,option.sku)===price).index : 0)); grid.append(card);
   }
   observer?.unobserve(sentinel);
   if(hasMore) observer?.observe(sentinel);
 }
 dialog.querySelector('.close').onclick=()=>dialog.close();
 dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});
 $('settings-open').onclick=()=>{
   for(const [key,value] of Object.entries(config)) form.elements.namedItem(key).value=value;
   $('settings-status').textContent='';
   settings.showModal();
 };
 $('settings-close').onclick=()=>settings.close();
 function formConfig(){ return window.pricing.clean(Object.fromEntries(new FormData(form))); }
 form.onsubmit=event=>{
   event.preventDefault();
   config=formConfig();
   $('settings-status').textContent=window.pricing.save(config)
     ? 'Настройки сохранены в этом браузере.'
     : 'Настройки применены для текущего просмотра.';
   render();
 };
 $('settings-export').onclick=()=>{
   if(!form.reportValidity()) return;
   const url=URL.createObjectURL(new Blob(['window.catalogSettings = '+JSON.stringify(formConfig())+';\n'],{type:'text/javascript'}));
   const link=el('a'); link.href=url; link.download='settings.js'; link.click();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
   $('settings-status').textContent='Для общего курса замените settings.js в папке размещённой витрины.';
 };
 const reset=()=>{shown=pageSize;render();};
 const categories=$('categories');
 const categoryLabels=[...categoryCounts.keys()].sort((a,b)=>categoryCounts.get(b)-categoryCounts.get(a));
 for(const category of ['',...categoryLabels]){
   const count=category ? categoryCounts.get(category) : products.length;
   if(!count) continue;
   const button=el('button',(category||'Все товары')+' · '+count,'category');
   button.type='button';
   button.setAttribute('aria-pressed',String(!category));
   button.addEventListener('click',()=>{
     selectedCategory=category;
     for(const item of categories.children) item.setAttribute('aria-pressed',String(item===button));
     reset();
   });
   categories.append(button);
 }
 function loadMore(){
   const start=shown;
   shown+=pageSize;
   render(start);
 }
 more.onclick=loadMore;
 material.addEventListener('change',reset);
 $('needs-check').addEventListener('change',reset);
 search.addEventListener('input',reset); order.addEventListener('change',reset); render();
});
</script>
</body>
